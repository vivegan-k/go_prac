        TEMPEST_VOLUME_DRIVER: EMC
        TEMPEST_VOLUME_VENDOR: Dell
        VERBOSE: true
        VERBOSE_NO_TIMESTAMP: true
      devstack_plugins:
        dell_tempest_plugin: https://github.com/dell-esg/dell_tempest_plugin
